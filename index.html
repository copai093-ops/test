<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Typing Test</title>

<style>
body{
  font-family: Arial;
  background:#e8f4f8;
  max-width:900px;
  margin:auto;
  padding:20px;
}
#box{
  background:#fff;
  padding:20px;
  border-radius:8px;
  margin-top:20px;
}
#para{
  background:#f2f2f2;
  padding:15px;
  border-radius:6px;
  font-size:17px;
}
textarea{
  width:100%;
  height:160px;
  margin-top:15px;
  font-size:16px;
  padding:10px;
}
button{
  padding:12px 20px;
  font-size:16px;
  background:green;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-top:15px;
}
#countdown{
  font-size:20px;
  font-weight:bold;
  color:#d9534f;
  text-align:right;
}
select,input{
  padding:10px;
  font-size:16px;
  width:80%;
  margin-top:10px;
}
</style>
</head>

<body>

<h1 style="text-align:center;">Typing Test</h1>

<!-- NAME + TIME -->
<div id="nameSection" style="text-align:center;margin-top:40px;">
  <input type="text" id="name" placeholder="Apna pura naam likho">
  <br>
  <select id="testTime">
    <option value="">Time select karo</option>
    <option value="5">5 Minutes</option>
    <option value="10">10 Minutes</option>
    <option value="15">15 Minutes</option>
  </select>
  <br>
  <button onclick="startTest()">Start Test</button>
</div>

<div id="countdown"></div>

<!-- TEST -->
<div id="testContent" style="display:none;">
  <div id="box">

    <h3>👇 Neeche diya gaya paragraph type karo</h3>

    <div id="para">
      Bharat ek mahaan desh hai. Yahan alag-alag bhasha, dharm aur sanskriti
      ke log mil julkar rehte hain. Hume apne desh par garv hona chahiye.
    </div>

    <textarea id="typedText" placeholder="Typing start karo..." disabled></textarea>

    <button onclick="submit()">Submit Test</button>

  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

const WEB_APP_URL ="https://script.google.com/macros/s/AKfycbwX2q18UcM1EGaN2oaA-bW3dSypidBPDqrT9nVyR5rkz6K7fJLT_HnJqqidpR86-VY8/exec";

const nameInput = document.getElementById("name");
const timeSelect = document.getElementById("testTime");
const testContent = document.getElementById("testContent");
const countdown = document.getElementById("countdown");
const typedText = document.getElementById("typedText");

let timeLeft = 0;
let totalTime = 0;
let timer;

if(localStorage.getItem("typingSubmitted")==="yes"){
  document.body.innerHTML =
  "<h2 style='text-align:center;color:red'>Test already submitted ❌</h2>";
}

window.startTest = function(){
  if(!nameInput.value.trim()){
    alert("Naam likho");
    return;
  }
  if(!timeSelect.value){
    alert("Time select karo");
    return;
  }

  totalTime = parseInt(timeSelect.value) * 60;
  timeLeft = totalTime;

  document.getElementById("nameSection").style.display="none";
  testContent.style.display="block";
  typedText.disabled = false;
  typedText.focus();

  timer = setInterval(()=>{
    countdown.innerText =
      `Time Left: ${Math.floor(timeLeft/60)}m ${timeLeft%60}s`;
    timeLeft--;
    if(timeLeft < 0) submit();
  },1000);
}

window.submit = function(){
  clearInterval(timer);

  let words = typedText.value.trim().split(/\s+/).length;
  let minutes = (totalTime - timeLeft) / 60;
  let speed = Math.round(words / minutes);

  let data = {
    name: nameInput.value,
    typedText: typedText.value,
    time: totalTime/60 + " minutes",
    speed: speed + " WPM"
  };

  fetch(WEB_APP_URL,{
    method:"POST",
    body: JSON.stringify(data),
    mode:"no-cors"
  });

  localStorage.setItem("typingSubmitted","yes");

  document.body.innerHTML =
  `<h2 style="text-align:center;color:green">
   Test Submitted ✅<br>
   Speed: ${speed} WPM
   </h2>`;
}

});
</script>

</body>
</html>
