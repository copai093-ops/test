<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Typing Test</title>

<style>
body{
  font-family: Arial;
  background:#e8f4f8;
  max-width:900px;
  margin:auto;
  padding:20px;
}
#box{
  background:#fff;
  padding:20px;
  border-radius:8px;
  margin-top:20px;
}
#para{
  background:#f2f2f2;
  padding:15px;
  border-radius:6px;
  font-size:17px;
}
textarea{
  width:100%;
  height:160px;
  margin-top:15px;
  font-size:16px;
  padding:10px;
}
button{
  padding:12px 20px;
  font-size:16px;
  background:green;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  margin-top:15px;
}
#countdown{
  font-size:20px;
  font-weight:bold;
  color:#d9534f;
  text-align:right;
}
select,input{
  padding:10px;
  font-size:16px;
  width:80%;
  margin-top:10px;
}
</style>
</head>

<body>

<h1 style="text-align:center;">Typing Test</h1>

<!-- NAME + TIME -->
<div id="nameSection" style="text-align:center;margin-top:40px;">
  <input type="text" id="name" placeholder="Apna pura naam likho">
  <br>
  <select id="testTime">
    <option value="">Time select karo</option>
    <option value="5">5 Minutes</option>
    <option value="10">10 Minutes</option>
    <option value="15">15 Minutes</option>
  </select>
  <br>
  <button onclick="startTest()">Start Test</button>
</div>

<div id="countdown"></div>

<!-- TEST -->
<div id="testContent" style="display:none;">
  <div id="box">

    <h3>👇 Neeche diya gaya paragraph type karo</h3>

    <div id="para">
      Bharat ek mahaan desh hai. Yahan alag-alag bhasha, dharm aur sanskriti
      ke log mil julkar rehte hain. Hume apne desh par garv hona chahiye.
    </div>

    <textarea id="typedText" placeholder="Typing start karo..." disabled></textarea>

    <button onclick="submitTest()">Submit Test</button>

  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

const WEB_APP_URL ="https://script.google.com/macros/s/AKfycbwX2q18UcM1EGaN2oaA-bW3dSypidBPDqrT9nVyR5rkz6K7fJLT_HnJqqidpR86-VY8/exec";

const nameInput = document.getElementById("name");
const timeSelect = document.getElementById("testTime");
const testContent = document.getElementById("testContent");
const countdown = document.getElementById("countdown");
const typedText = document.getElementById("typedText");

let timeLeft = 0;
let totalTime = 0;
let timer = null;

// START TEST
window.startTest = function(){
  if(!nameInput.value.trim()){
    alert("Naam likho");
    return;
  }
  if(!timeSelect.value){
    alert("Time select karo");
    return;
  }

  totalTime = parseInt(timeSelect.value) * 60;
  timeLeft = totalTime;

  document.getElementById("nameSection").style.display="none";
  testContent.style.display="block";
  typedText.disabled = false;
  typedText.value = "";
  typedText.focus();

  countdown.innerText =
    `Time Left: ${Math.floor(timeLeft/60)}m ${timeLeft%60}s`;

  timer = setInterval(()=>{
    timeLeft--;
    countdown.innerText =
      `Time Left: ${Math.floor(timeLeft/60)}m ${timeLeft%60}s`;
    if(timeLeft <= 0){
      submitTest();
    }
  },1000);
}

// SUBMIT TEST
window.submitTest = function(){
  if(timer) clearInterval(timer);

  let text = typedText.value.trim();
  let words = text ? text.split(/\s+/).length : 0;
  let minutesUsed = (totalTime - timeLeft) / 60;
  if(minutesUsed <= 0) minutesUsed = 1/60;

  let speed = Math.round(words / minutesUsed);

  let formData = new FormData();
  formData.append("name", nameInput.value);
  formData.append("typedText", typedText.value);
  formData.append("time", (totalTime/60) + " minutes");
  formData.append("speed", speed + " WPM");

  fetch(WEB_APP_URL,{
    method:"POST",
    body: formData
  });

  document.body.innerHTML =
  `<h2 style="text-align:center;color:green">
    Test Submitted Successfully ✅<br><br>
    Name: ${nameInput.value}<br>
    Speed: ${speed} WPM
  </h2>`;
}

});
</script>

</body>
</html>
